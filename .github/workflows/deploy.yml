# Deploy via SSH after build/test succeeds.
# Required GitHub Actions secrets:
# - SSH_HOST: server hostname or IP address
# - SSH_USER: SSH user with access to /opt/family-scheduler
# - SSH_KEY: private SSH key for that user
# - SSH_PORT: SSH port (optional; defaults to 22 when omitted)

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run server deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: /opt/family-scheduler/scripts/deploy.sh
